name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # 8: Tarp and its tests; 10: the SDK, and the sample's target framework
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet build McDcTestCoverage.sln -c Release
      - run: dotnet test TarpTests -c Release --no-build

  # Tarp's MC/DC verdicts against the NASA MC/DC tutorial's worked examples, clang's MC/DC, and two
  # reference checkers written from the definitions (see crosscheck/crosscheck.py)
  crosscheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: LLVM 18 (clang's -fcoverage-mcdc, llvm-cov --show-mcdc)
        run: sudo apt-get update && sudo apt-get install -y clang-18 llvm-18
      - run: python3 -I crosscheck/crosscheck.py crosscheck/tarp-runner "$RUNNER_TEMP/crosscheck"
        env:
          CLANG: clang-18
          LLVM_PROFDATA: llvm-profdata-18
          LLVM_COV: llvm-cov-18

  # the packed tool on a real solution
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      # lcov 2.6 (Ubuntu's is older, without MC/DC), to check that it reads Tarp's tracefile
      - name: Install lcov
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcapture-tiny-perl libdatetime-perl libdevel-stacktrace-perl libjson-xs-perl libtimedate-perl
          git clone --depth 1 --branch v2.6 https://github.com/linux-test-project/lcov "$RUNNER_TEMP/lcov"
          echo "GENHTML=$RUNNER_TEMP/lcov/bin/genhtml" >> "$GITHUB_ENV"
      - run: bash samples/e2e.sh
        shell: bash
